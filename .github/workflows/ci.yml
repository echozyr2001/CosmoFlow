name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format-check:
    name: Code Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
          cache: true
          cache-directories: |-
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Check Rust Format
        run: cargo +nightly fmt --all --check

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy
          cache: true
          cache-directories: |-
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Run Clippy
        run: cargo +nightly clippy --all-features --workspace -- -D warnings

  test:
    name: Run Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: async
            features: "--features async"
          - name: storage-memory
            features: "--features storage-memory"
          - name: async-storage-memory
            features: "--features async,storage-memory"
          - name: all-features
            features: "--all-features"
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-directories: |-
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Install nextest
        run: cargo install cargo-nextest --locked

      - name: Run Tests with Nextest
        run: cargo nextest run ${{ matrix.features }} --workspace

      - name: Run Doc Tests
        run: cargo test --doc ${{ matrix.features }} --workspace

  build:
    name: Build Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            features: "--no-default-features"
          - name: storage-full
            features: "--features storage-full"
          - name: all-features
            features: "--all-features"
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-directories: |-
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Build Project
        run: cargo build ${{ matrix.features }} --workspace

  feature-gate-check:
    name: Feature Gate Validation (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            features: "--no-default-features"
          - name: async
            features: "--features async"
          - name: storage-memory
            features: "--features storage-memory"
          - name: storage-file
            features: "--features storage-file"
          - name: storage-redis
            features: "--features storage-redis"
          - name: storage-full
            features: "--features storage-full"
          - name: async-storage-full
            features: "--features async,storage-full"
          - name: all-features
            features: "--all-features"
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-directories: |-
            ~/.cargo/registry
            ~/.cargo/git
            target

      - name: Check compilation
        run: cargo check ${{ matrix.features }} --workspace

      - name: Run doc tests (quick check)
        run: cargo test --doc ${{ matrix.features }} --workspace

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
